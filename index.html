<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Jogo da Juju</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jogo da Juju">
<meta name="theme-color" content="#1b3c58">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="manifest" href='data:application/manifest+json,{"name":"Jogo da Juju","short_name":"Juju","start_url":".","display":"fullscreen","orientation":"landscape","background_color":"%231b3c58","theme_color":"%231b3c58","icons":[{"src":"assets/icon.png","sizes":"512x512","type":"image/png"}]}'>
<style>
  :root{
    --sky1:#8fd3ff; --sky2:#dff5ff; --sea:#2b8fc7; --sand:#f1d9a0; --sand2:#d9b56e;
    --ink:#2a2420; --paper:#fff7e4; --accent:#ff7a3d;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#fff7e4; --ink:#2a2420; } }
  html,body{height:100%;margin:0;background:#1b3c58;overscroll-behavior:none}
  body{font-family:"Baloo 2","Fredoka",ui-rounded,system-ui,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden}
  #wrap{position:relative;width:100%;max-width:1100px;max-height:100%;display:flex;flex-direction:column;align-items:center}
  #stage{position:relative;width:100%;aspect-ratio:16/9}
  canvas{display:block;width:100%;height:100%;image-rendering:auto;border-radius:12px;background:var(--sky1)}
  #hud{position:absolute;left:0;right:0;top:0;padding:10px 14px;display:flex;justify-content:space-between;pointer-events:none;font-weight:700;font-size:clamp(14px,2vw,20px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
  #msg{position:absolute;left:50%;top:52px;transform:translateX(-50%);max-width:70%;background:rgba(255,247,228,.92);color:var(--ink);border-radius:14px;padding:8px 16px;font-size:clamp(13px,1.8vw,19px);font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.18);opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}
  #msg.show{opacity:1}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(27,60,88,.78);color:#fff;text-align:center;padding:20px;border-radius:12px}
  #overlay h1{margin:0;font-size:clamp(28px,6vw,64px);letter-spacing:-.02em;text-shadow:0 4px 0 rgba(0,0,0,.3)}
  #overlay p{margin:0;font-size:clamp(14px,2.2vw,20px);max-width:38ch;line-height:1.4}
  #overlay button{font:inherit;font-weight:800;font-size:clamp(16px,2.4vw,24px);padding:12px 30px;border:0;border-radius:999px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 6px 0 #c4541d}
  #overlay button:active{transform:translateY(4px);box-shadow:0 2px 0 #c4541d}
  #overlay button:focus-visible{outline:4px solid #fff}
  #overlay button.small{font-size:clamp(12px,1.6vw,16px);padding:8px 18px;background:rgba(255,247,228,.25);box-shadow:none;color:#fff}
  .hidden{display:none !important}
  kbd{background:rgba(255,255,255,.2);border-radius:6px;padding:1px 7px}
  /* botões de toque numa faixa ABAIXO do jogo, pra não cobrir os personagens */
  #touch{display:none;width:100%;box-sizing:border-box;padding:8px 3% 0;justify-content:space-between;align-items:center;gap:12px}
  #touch.on{display:flex}
  .grp{display:flex;gap:min(14px,2vw);align-items:center;height:100%}
  /* celular deitado (pouca altura): botões translúcidos por cima do jogo, nos cantos */
  #wrap.over #touch.on{position:absolute;inset:0;height:auto !important;padding:0 2% 2%;align-items:flex-end;pointer-events:none}
  #wrap.over .grp{pointer-events:none;height:auto;align-items:flex-end}
  #wrap.over .tb{pointer-events:auto;background:rgba(255,247,228,.38);box-shadow:none;width:min(11vw,17vh)} #wrap.over #tJ{width:min(13vw,21vh)} #wrap.over #tC{width:min(8vw,12vh)}
  #wrap.over .tb:active,#wrap.over .tb.down{background:rgba(255,122,61,.85)}
  .tb{width:min(13vw,120px,20vh);aspect-ratio:1;border-radius:50%;border:0;background:rgba(255,247,228,.55);color:#2a2420;font:inherit;font-weight:800;font-size:clamp(18px,4vw,30px);pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 4px 0 rgba(0,0,0,.25)}
  .tb:active,.tb.down{background:rgba(255,122,61,.9);color:#fff}
  #tJ{width:min(16vw,140px,24vh)} #tC{width:min(9vw,72px,14vh);font-size:clamp(14px,3vw,22px)}
  #padBtn,#musBtn{position:absolute;top:8px;left:50%;transform:translateX(-50%);border:0;background:rgba(255,247,228,.6);border-radius:999px;padding:4px 12px;font-size:18px;cursor:pointer}
  #musBtn{left:calc(50% + 56px)}
  #err{position:absolute;top:48px;left:50%;transform:translateX(-50%);background:#c0392b;color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;display:none;max-width:90%}
  #wrap:focus{outline:none}
</style>
</head>
<body>
<div id="wrap" tabindex="0">
 <div id="stage">
  <canvas id="c" width="1280" height="720"></canvas>
  <div id="hud"><span id="hudL"></span><span id="hudR"></span></div>
  <button id="padBtn" title="Mostrar/ocultar botões na tela" aria-label="botões na tela">🎮</button>
  <button id="musBtn" title="Música" aria-label="ligar ou desligar música">🔊</button>
  <div id="err" role="alert"></div>
  <div id="msg"></div>
  <div id="overlay">
    <h1>Jogo da Juju</h1>
    <p id="ovText">Episódio 1 — Ilha dos Náufragos. Dois amigos naufragaram numa ilha. Dizem que há um tesouro enterrado do outro lado… Vamos achar?</p>
    <p id="ctrlHelp"><kbd>← →</kbd> andar &nbsp; <kbd>↑</kbd> ou <kbd>espaço</kbd> pular &nbsp; <kbd>Z</kbd> jogar coco &nbsp; <kbd>X</kbd> agir / cavar / espada &nbsp; <kbd>C</kbd> trocar herói &nbsp; <kbd>↑ ↓</kbd> na corda sobe e desce</p>
    <button id="startBtn">Começar aventura</button>
    <button id="l2Btn" class="small">Ir direto ao navio pirata (episódio 2)</button>
    <button id="l3Btn" class="small">Ir direto à floresta (episódio 3)</button>
  </div>
 </div>
  <div id="touch">
    <div class="grp">
      <button class="tb" id="tL" data-k="arrowleft" aria-label="esquerda">◀</button>
      <button class="tb" id="tR" data-k="arrowright" aria-label="direita">▶</button>
      <button class="tb" id="tC" data-k="c" aria-label="trocar herói">🔄</button>
    </div>
    <div class="grp">
      <button class="tb" id="tZ" data-k="z" aria-label="coco">🥥</button>
      <button class="tb" id="tX" data-k="x" aria-label="agir">X</button>
      <button class="tb" id="tJ" data-k="arrowup" aria-label="pular / subir">⬆</button>
    </div>
  </div>
</div>
<script>
// ===================== CONFIGURAÇÃO (edite à vontade) =====================
const CFG = {
  heroA: { name: "Juju", color: "#3b8fe6", dark:"#2660a8", belly:"#dff0ff", type:"jumper" }, // herói 1
  heroB: { name: "Papai", color: "#9b5de5", dark:"#6a3bb0", belly:"#f1e4ff", type:"thrower" }, // herói 2
  heroC: { name: "Herói 3", color: "#3fae5a", dark:"#237a3a", belly:"#e3ffe8", type:"listener" }, // herói 3 (só no episódio 3) — TROQUE O NOME AQUI
  // habilidades da floresta (episódio 3): qual herói resolve cada desafio
  skills: { strength:"thrower", vines:"jumper", hearing:"listener" }, // força = Papai, cipós = Juju, ouvido = Herói 3
  worm: { name: "Sherman", offsetY: 38 }, // a minhoca que vai na cabeça de quem lidera; offsetY = altura acima do boneco (ajuste se usar sprites altos)
  helper:{ name: "Side", color: "#ffd23f", dark:"#d49a00" }, // o Side: nome igual em todas as fases, personagem diferente em cada uma (imagens em assets/epN/)
  speed: 4.4, gravity: 0.5, jumpA: -15.5, jumpB: -15.5, coyote: 9, jumpBuffer: 9, // pulo longo e tolerante: pode apertar um pouco antes ou um pouco depois da beirada // os dois pulam igual e jogam coco igual; a liderança alterna nos pontos da fase e com a tecla C
  // Imagens opcionais: coloque PNGs com estes nomes na pasta assets/ ao lado do index.html
  // (fundo transparente, personagem olhando para a DIREITA). Se não existirem, usa o desenho padrão.
  sprites: { heroA:"assets/heroi1.png", heroB:"assets/heroi2.png", heroC:"assets/heroi3.png", helper1:"assets/ep1/ajudante.png", helper2:"assets/ep2/ajudante.png", helper3:"assets/ep3/ajudante.png", heightA:200, heightB:200, heightC:200, footC:22, heightHelper:150,
    // pixels de margem transparente ABAIXO dos pés em cada quadro (na escala original do PNG). Aumente se o personagem parecer flutuar.
    footA:22, footB:22, footHelper:22, shadow:false }, // altura em pixels na tela — aumente/diminua aqui
  helperOffset: 150, // distância da ajudante: positivo = vai à frente dos heróis, negativo = vem atrás
  // Animação opcional por SPRITE SHEET (tem prioridade sobre a imagem única acima).
  // Grade regular, todos os quadros do MESMO tamanho. 'rows' = total de linhas (4 ou 8).
  // Linhas 0-3: parado, andando, pulando, mexendo os braços (olhando para a DIREITA).
  // Linhas 4-7 (opcionais): as mesmas, olhando para a ESQUERDA. Se a folha tiver só 4 linhas, o jogo espelha sozinho.
  // 'mexendo os braços' toca quando o herói joga coco ou cava.
  sheets: {
    heroA:{ file:"assets/heroi1_sheet.png", cols:6, rows:8, frames:{idle:2, walk:6, jump:6, arms:6}, fps:8 },
    heroB:{ file:"assets/heroi2_sheet.png", cols:6, rows:8, frames:{idle:2, walk:6, jump:6, arms:6}, fps:8 },
    heroC:{ file:"assets/heroi3_sheet.png", cols:6, rows:8, frames:{idle:2, walk:6, jump:6, arms:6}, fps:8 },
    helper3:{ file:"assets/ep3/ajudante_sheet.png", cols:6, rows:8, frames:{idle:2, walk:6, jump:6, arms:6}, fps:8 }, // Side do episódio 3 (a cientista)
    worm:{ file:"assets/ep3/minhoca_sheet.png", cols:6, rows:4, frames:{idle:2, walk:6, jump:6, arms:6}, fps:6, height:70, foot:10 }, // Sherman (opcional): usa "idle" no ombro, "jump" na alegria do final
    helper1:{ file:"assets/ep1/ajudante_sheet.png", cols:6, rows:8, frames:{idle:2, walk:6, jump:6, arms:6}, fps:8 }, // Side do episódio 1 (ilha)
    helper2:{ file:"assets/ep2/ajudante_sheet.png", cols:6, rows:8, frames:{idle:2, walk:6, jump:6, arms:6}, fps:8 }, // Side do episódio 2 (navio)
    // caranguejo: 6 linhas — 0 parado frente, 1 andando frente, 2 garras frente, 3 parado costas, 4 andando costas, 5 garras costas (quadros 512×512)
    crab1:{ file:"assets/ep1/caranguejo_sheet.png", cols:6, rows:6, frames:{idle:2, walk:6, claws:6, idleBack:2, walkBack:6, clawsBack:6}, fps:8, height:95, foot:70 },
    crab2:{ file:"assets/ep2/caranguejo_sheet.png", cols:6, rows:6, frames:{idle:2, walk:6, claws:6, idleBack:2, walkBack:6, clawsBack:6}, fps:8, height:95, foot:70 }, // caranguejo de porão (navio)
    // piratas da fase 2 (opcionais): mesmo esquema dos heróis — linhas: parado, andando, pulando (usada quando tonto), braços (jogando barril); 4 linhas olhando pra DIREITA (o jogo espelha) ou 8 linhas
    pirate:{ file:"assets/ep2/pirata_sheet.png", cols:6, rows:4, frames:{idle:2, walk:6, jump:6, arms:6}, fps:8, height:150, foot:22 },
    captain:{ file:"assets/ep2/capitao_sheet.png", cols:6, rows:4, frames:{idle:2, walk:6, jump:6, arms:6}, fps:8, height:220, foot:22 },
  },
};
// =========================================================================

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, GROUND = 600;
const hudL = document.getElementById('hudL'), hudR = document.getElementById('hudR');
const msgEl = document.getElementById('msg'), overlay = document.getElementById('overlay'), ovText = document.getElementById('ovText');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- Sprites opcionais ----------
const IMG={};
for(const k of ['heroA','heroB','heroC','helper1','helper2','helper3']){ const im=new Image(); im.onload=()=>{IMG[k]=im;}; im.onerror=()=>{}; im.src=CFG.sprites[k]; }
const SHEET={};
for(const k of ['heroA','heroB','heroC','helper1','helper2','helper3','crab1','crab2','pirate','captain','worm']){ const im=new Image(); im.onload=()=>{SHEET[k]=im;}; im.onerror=()=>{}; im.src=CFG.sheets[k].file; }

// ---------- Mundo ----------
let LEVEL=1, LEVEL_W=7000;
let solids, water, planks, coconuts, crabs, gates, bridge, vine, treasure, checkpoints;
// elementos da fase 2 (navio pirata)
let ropes=[], barrels=[], throwers=[], cage=null, swordChest=null, boss=null, wheel=null, hatches=[], cut=null, flagHero=false;
// elementos da fase 3 (floresta)
let boulder=null, vines3=[], listens=[], mushrooms=[], wormFamily=null, worm=null, forest=null;

function buildLevel(){
  boulder=null; vines3=[]; listens=[]; mushrooms=[]; wormFamily=null; forest=null;
  if(LEVEL===2){ buildLevel2(); return; }
  if(LEVEL===3){ buildLevel3(); return; }
  LEVEL_W=7000; ropes=[]; barrels=[]; throwers=[]; cage=null; swordChest=null; boss=null; wheel=null; hatches=[]; flagHero=false;
  buildLevel1();
}
function buildLevel1(){
  solids = [
    {x:0,y:GROUND,w:1500,h:200},
    {x:1650,y:GROUND,w:950,h:200},     // após o primeiro lago
    {x:2900,y:GROUND,w:1100,h:200},    // após a ponte
    {x:4000,y:GROUND,w:1300,h:200},
    {x:5700,y:GROUND,w:1300,h:200},    // após o cipó
    // plataformas
    {x:600,y:470,w:160,h:24},{x:820,y:380,w:150,h:24},{x:1150,y:420,w:180,h:24},
    {x:1900,y:470,w:140,h:24},{x:2150,y:380,w:200,h:24},{x:2400,y:470,w:140,h:24},
    {x:3300,y:460,w:170,h:24},{x:3600,y:360,w:170,h:24},
    {x:4400,y:470,w:150,h:24},{x:4650,y:390,w:170,h:24},{x:4950,y:470,w:160,h:24},
  ];
  water = [{x:1500,w:150},{x:2600,w:300},{x:5300,w:400}];
  planks = [{x:850,y:340,got:false},{x:1200,y:385,got:false},{x:2200,y:345,got:false}];
  coconuts = [{x:400,y:560},{x:1900,y:560},{x:2000,y:560},{x:3200,y:560},{x:4100,y:560},{x:4200,y:560},{x:4300,y:560},{x:5800,y:560}];
  crabs = [{x:1000,min:900,max:1400,dir:1,stun:0,flee:0},{x:3500,min:3300,max:3900,dir:1,stun:0,flee:0},{x:4500,min:4400,max:4900,dir:-1,stun:0,flee:0},{x:6000,min:5800,max:6300,dir:1,stun:0,flee:0}];
  gates = [ // pontos onde a liderança troca automaticamente (quem estava atrás passa pra frente)
    {x:560,  text:"Hora de pular alto!"},
    {x:880,  text:"Caranguejo à vista! Joga um coco nele."},
    {x:1250, text:"Pula o laguinho!"},
    {x:1850, text:"Pega a tábua lá em cima!"},
    {x:3150, text:"Mais caranguejos. Mira bem!"},
    {x:4100, text:"Falta pouco, vamos!"},
    {x:5100, text:"Prepara o cipó…"},
  ];
  bridge = {x:2600,w:300,built:false,need:3};
  vine = {hookX:5500,hookY:260,startX:5240,endX:5740,active:false,t:0,cooldown:0,follow:false,ft:0};
  treasure = {x:6700,digs:0,need:6,found:false};
  checkpoints = [100, 1750, 2950, 4050, 5750];
}

// ===================== FASE 3: O CORAÇÃO DA FLORESTA =====================
function buildLevel3(){
  LEVEL_W=6600;
  const nameOf=t=>[CFG.heroA,CFG.heroB,CFG.heroC].find(d=>d.type===t).name;
  solids=[
    {x:0,y:GROUND,w:1000,h:200},{x:1150,y:GROUND,w:500,h:200},{x:1810,y:GROUND,w:590,h:200},
    {x:2580,y:GROUND,w:90,h:200},{x:2870,y:GROUND,w:90,h:200},                      // ilhotas da ravina
    {x:3130,y:GROUND,w:770,h:200},{x:4060,y:GROUND,w:1140,h:200},{x:5370,y:GROUND,w:1300,h:200},
    {x:700,y:470,w:140,h:24},{x:1250,y:460,w:140,h:24},
    {x:3400,y:450,w:150,h:24},{x:3650,y:360,w:150,h:24},
    {x:4700,y:470,w:140,h:24},{x:4950,y:380,w:140,h:24},{x:5500,y:470,w:150,h:24},
  ];
  water=[{x:1000,w:150},{x:1650,w:160},{x:2400,w:180},{x:2670,w:200},{x:2960,w:170},{x:3900,w:160},{x:5200,w:170}]; // lamaçais e ravina
  planks=[]; crabs=[]; barrels=[];
  coconuts=[{x:720,y:430},{x:770,y:430},{x:1290,y:420},{x:3450,y:410},{x:3700,y:320},{x:3750,y:320},{x:4750,y:430},{x:5000,y:340},{x:5550,y:430}];
  mushrooms=[{x:3290,y:GROUND-40,w:90,h:20,sq:0,mush:true},{x:4480,y:GROUND-40,w:90,h:20,sq:0,mush:true},{x:5620,y:GROUND-40,w:90,h:20,sq:0,mush:true}];
  solids.push(...mushrooms);
  boulder={x:1440,w:150,pushes:0,need:4,gone:false,roll:0,pit:{x:1650,w:160},shake:0};
  vines3=[{hookX:2475,hookY:380,startX:2340,endX:2610,done:false},{hookX:2745,hookY:380,startX:2610,endX:2880,done:false},{hookX:3015,hookY:380,startX:2880,endX:3150,done:false}];
  listens=[{x:4150,wall:4300,done:false,t:0,kind:'wall'},{x:5950,wall:null,done:false,t:0,kind:'family'}];
  wormFamily={x:6250,visible:false,t:0};
  gates=[{x:600,to:CFG.skills.strength,text:`${nameOf(CFG.skills.strength)} na frente! Tem algo pesado logo ali.`},
         {x:3350,to:CFG.skills.hearing,text:`Agora quem guia é ${nameOf(CFG.skills.hearing)}. Ouvidos atentos!`},
         {x:4650,to:CFG.skills.vines,text:`${nameOf(CFG.skills.vines)} na frente até a clareira!`}];
  bridge={x:-9999,w:0,built:false,need:3};
  vine={hookX:-99999,hookY:380,startX:-99999,endX:-99999,active:false,t:0,cooldown:0,follow:false,ft:0,cur:null};
  treasure={x:-99999,digs:0,need:6,found:true};
  checkpoints=[100,1250,2200,3250,4100,4700,5500];
  forest={fireflies:Array.from({length:26},(_,i)=>({x:(i*257)%LEVEL_W,y:120+(i*131)%380,p:i*0.7}))};
}

// ===================== FASE 2: O NAVIO PIRATA =====================
function buildLevel2(){
  LEVEL_W=5800;
  solids=[
    // convés (com escotilhas abertas no meio: cair = volta ao último ponto)
    {x:0,y:GROUND,w:1600,h:200},{x:1760,y:GROUND,w:740,h:200},{x:2660,y:GROUND,w:840,h:200},{x:3660,y:GROUND,w:2140,h:200},
    // caixotes e andaimes
    {x:900,y:470,w:140,h:24},{x:1300,y:400,w:150,h:24},
    {x:1830,y:200,w:150,h:24},{x:2080,y:280,w:150,h:24},{x:2320,y:370,w:150,h:24},   // gávea do 1º mastro e descida
    {x:2900,y:470,w:140,h:24},{x:3200,y:400,w:150,h:24},
    {x:3830,y:200,w:150,h:24},{x:4080,y:290,w:150,h:24},{x:4330,y:400,w:150,h:24},   // gávea do 2º mastro e descida
    {x:4900,y:450,w:140,h:24},{x:5400,y:450,w:140,h:24},
  ];
  hatches=[{x:1600,w:160},{x:2500,w:160},{x:3500,w:160}]; water=hatches;
  planks=[];
  crabs=[{x:1000,min:720,max:1520,dir:1,stun:0,flee:0},{x:4000,min:3720,max:4520,dir:-1,stun:0,flee:0}]; // caranguejos de porão passeando no convés
  coconuts=[{x:620,y:560},{x:680,y:560},{x:740,y:560},{x:2800,y:560},{x:2860,y:560},{x:3880,y:160},{x:3930,y:160},{x:4600,y:560},{x:4660,y:560},{x:4720,y:560}];
  ropes=[{x:1905,top:170,bottom:GROUND},{x:3905,top:170,bottom:GROUND}];
  throwers=[{x:1375,y:400,face:-1,timer:50,armsT:0},{x:3275,y:400,face:-1,timer:50,armsT:0}];
  barrels=[];
  cage={x:40,w:440,open:false,keyT:0,helperArrived:false,doorA:0};
  swordChest={x:1905,y:200,got:false};

    const target = leader.x - 70*active.face;
    const d = target-h.x;
    const targetOk = [0,40,80,120,160].some(dy=>groundAt(target,h.w,h.y+dy,h.h)) || Math.abs(d)>170; // não anda pra cima de um buraco só pra ficar atrás do líder
    if(Math.abs(d)>12 && targetOk){ h.vx=Math.sign(d)*CFG.speed*0.95; h.face=Math.sign(d); } else h.vx*=0.5;
    // pula junto com o líder (com um atraso curto, pra parecer que vai atrás) e pula sozinho ao ver um buraco à frente
    if(h.syncJump>0){ h.syncJump--; if(h.syncJump===0 && h.onGround && Math.abs(d)<260){ h.vy=CFG.jumpA; h.onGround=false; burst(h.x+h.w/2,h.y+h.h,"#f1d9a0",5); } }
    const ahead = h.x + (h.vx>0?h.w+34:-34);
    const holeAhead = h.onGround && Math.abs(h.vx)>1 && [0,40,80,120,160].every(dy=>!groundAt(ahead-h.w/2,h.w,h.y+dy,h.h));
    if(h.onGround && (holeAhead || Math.abs(d)>170 || (leader.y<h.y-40 && Math.abs(d)<200))){ h.vy=CFG.jumpA; h.onGround=false; }
    if(Math.abs(d)>600 || (leader.y<h.y-130 && Math.abs(d)<450 && leader.onGround)){ h.x=leader.x-60*active.face; h.y=leader.y; h.vy=0; burst(h.x+h.w/2,h.y+h.h/2,"#fff",8); }
  }
  h.vy+=CFG.gravity; if(h.vy>18)h.vy=18;
  h.x+=h.vx; h.y+=h.vy;
  if(h.x<0)h.x=0; if(h.x>LEVEL_W-h.w)h.x=LEVEL_W-h.w;
  if(cage&&!cage.open){ const lim=cage.x+cage.w-16-h.w; if(h.x>lim){ h.x=lim; if(h.vx>0)h.vx=0; } }
  if(boulder&&!boulder.gone){ const lim=boulder.x-h.w+6; if(h.x>lim && h.y+h.h>GROUND-130){ h.x=lim; if(h.vx>0)h.vx=0; } }
  for(const li of listens){ if(li.wall&&!li.done){ const lim=li.wall-h.w+4; if(h.x>lim){ h.x=lim; if(h.vx>0)h.vx=0; } } }
  h.onGround=false;
  if(h.vy>=0){ const g=groundAt(h.x,h.w,h.y,h.h); if(g){ h.y=g.y-h.h; h.vy=0; h.onGround=true;
    if(g.mush){ h.vy=CFG.jumpA*1.45; h.onGround=false; g.sq=12; burst(h.x+h.w/2,g.y,"#ffb3c6",8); if(ctrl) sfx([12,19],0.05,0.2); } } } // cogumelo-trampolim
  if(Math.abs(h.vx)>0.5&&h.onGround) h.walk+=0.25; else h.walk=0;
  if(h.throwCd>0)h.throwCd--; if(h.armsT>0)h.armsT--; if(h.digT>0)h.digT--;
  // caiu na água
  if(h.y>GROUND+40){
    if(ctrl){ say(LEVEL===2?"Opa, caiu pela escotilha! Subindo de volta.":"Opa, água! Vamos tentar de novo."); respawn(); }
    else { h.x=leader.x-60*active.face; h.y=leader.y; h.vy=0; }
  }
}
function respawn(){
  active.x=lastCheckpoint; active.y=GROUND-active.h-10; active.vx=0; active.vy=0;
  followers.forEach((f,i)=>{ f.x=lastCheckpoint-60*(i+1); f.y=active.y; f.vy=0; });
  burst(active.x+20,active.y+30,"#8fd3ff",16);
}

function hurt(fromX,text){ if(active.hurt>0||active.climb) return; const hx=active.x+active.w/2; active.hurt=45; active.vx=(hx<fromX?-1:1)*9; active.vy=-7; active.x+=active.vx*2; burst(hx,active.y+active.h/2,"#ff6b6b",8); say(text,1200); }
function burst(x,y,c,n){ if(reduceMotion)n=Math.min(n,4); for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*8,vy:-Math.random()*7,life:30+Math.random()*20,c}); }

// ---------- Update ----------
function update(){
  if(state==="cut"){ updateCut(); return; }
  if(state!=="play"){ return; }
  if(msgTimer>0){ msgTimer-=16; if(msgTimer<=0) msgEl.classList.remove('show'); }

  // cipó em andamento
  if(vine.active){
    vine.t+=reduceMotion?0.03:0.018;
    const a = -Math.PI*0.42 + vine.t*Math.PI*0.84; // de -75° a +75°
    const len = GROUND-80-vine.hookY;
    active.x = vine.hookX + Math.sin(a)*len - active.w/2;
    active.y = vine.hookY + Math.cos(a)*len - active.h/2;
    active.vy=0;
    if(vine.t>=1){ vine.active=false; active.x=vine.endX; active.y=GROUND-active.h-20; active.vy=2; vine.cooldown=40;
      if(LEVEL===3){ followers.forEach((f,i)=>{ f.x=vine.endX-14*(i+1); f.y=GROUND-f.h-10; f.vy=1; burst(f.x+20,f.y+30,"#fff",8); }); say(vines3.every(v=>v.done)?"Ravina vencida! Todos do outro lado.":"Boa! Próximo cipó.",1800); }
      else { vine.follow=true; vine.ft=0; say("Uhuuul! Agora é a vez de "+follower.def.name+"!"); } }
    else followers.forEach((f,i)=>{ f.x=vine.startX-40-i*40; f.vy=0; f.y=GROUND-f.h; });
  } else if(vine.follow){
    // o segundo herói atravessa no cipó logo depois
    stepHero(active,true);
    vine.ft+=reduceMotion?0.03:0.02;
    const a = -Math.PI*0.42 + Math.min(vine.ft,1)*Math.PI*0.84, len = GROUND-80-vine.hookY;
    follower.x = vine.hookX + Math.sin(a)*len - follower.w/2; follower.y = vine.hookY + Math.cos(a)*len - follower.h/2; follower.vy=0; follower.face=1;
    if(vine.ft>=1){ vine.follow=false; follower.x=vine.endX-50; follower.y=GROUND-follower.h-10; follower.vy=2; burst(follower.x+20,follower.y+30,"#fff",10); say("Os dois do outro lado! Sigam em frente."); }
  } else {
    stepHero(active,true);
    followers.forEach((f,i)=>stepHero(f,false,i===0?active:followers[i-1]));
    if(vine.cooldown>0)vine.cooldown--;
  }

  // checkpoints
  for(const cp of checkpoints) if(active.x>cp && cp>lastCheckpoint) lastCheckpoint=cp;

  // portões de troca
  for(const g of gates){ if(!g.done && active.x>g.x && active.onGround && followers.every(f=>f.onGround&&Math.abs(active.x-f.x)<260)){ g.done=true; swapTo(g.to||'other',g.text); } }

  // coletar
  const hx=active.x+active.w/2, hy=active.y+active.h/2;
  for(const p of planks){ if(!p.got && Math.hypot(hx-p.x,hy-p.y)<50){ p.got=true; items.planks++; burst(p.x,p.y,"#c58d4b",10); say(`Tábua! (${items.planks}/3)`); } }
  for(const c of coconuts){ if(!c.got && Math.hypot(hx-c.x,hy-(c.y))<46){ c.got=true; items.coconuts++; burst(c.x,c.y,"#8b5a2b",8); } }

  // ponte
  const nearBridge = active.x+active.w > bridge.x-120 && active.x < bridge.x && !bridge.built;
  if(nearBridge){
    if(items.planks>=bridge.need){ bridge.built=true; items.planks=0; bird.armsT=60; burst(bridge.x+150,GROUND,"#c58d4b",30); say(`${CFG.helper.name}: "Tábuas na mão? Deixa comigo!" — Ponte construída!`,3200); }
    else if(msgTimer<=0) say(`${CFG.helper.name}: "Faltam ${bridge.need-items.planks} tábuas pra ponte. Tem nas plataformas altas — uma delas fica logo depois do laguinho!"`,2600);
  }

  // cipó: apertar X perto da beira
  if(LEVEL===3){ const v=vines3.find(v=>!v.done && active.x>v.startX-140 && active.x<v.startX+70); if(v&&!vine.active&&vine.cooldown===0){ Object.assign(vine,{hookX:v.hookX,hookY:v.hookY,startX:v.startX,endX:v.endX}); vine.cur=v; } else if(!vine.active) vine.cur=null; }
  const nearVine = !vine.active && !vine.follow && vine.cooldown===0 && active.x>vine.startX-140 && active.x<vine.startX+(LEVEL===3?70:20) && active.onGround && (LEVEL!==3||vine.cur);
  if(nearVine && msgTimer<=0){ if(LEVEL===3 && active.def.type!==CFG.skills.vines){ swapTo(CFG.skills.vines,`Cipós? Isso é com ${heroes.find(h=>h.def.type===CFG.skills.vines).def.name}!`); } else say(`${CFG.helper.name}: "Aperta X pra agarrar o cipó!"`,1800); }
  if(keys['x']&&!xHeld){
    if(LEVEL===2){
      if(cage&&!cage.open&&cage.helperArrived&&active.x+active.w>cage.x+cage.w-140){ cage.open=true; bird.armsT=60; burst(cage.x+cage.w,GROUND-60,"#ffd23f",18); sfx([0,4,7,12]); say(`${CFG.helper.name}: "Porta aberta! Corram pra direita!"`,3000); }
      else if(swordChest&&!swordChest.got&&Math.hypot(hx-swordChest.x,hy-(swordChest.y-20))<90){ swordChest.got=true; items.sword=true; burst(swordChest.x,swordChest.y-20,"#ffd23f",20); sfx([7,11,14,19]); say("Espada pirata! Aperta X pra golpear os barris… e o capitão!",3400); }
      else if(items.sword&&active.swingT===0&&!active.climb){ active.swingT=22; active.armsT=active.armsMax; sfx([19,24],0.06,0.2); }
    }
    else if(nearVine && (LEVEL!==3 || active.def.type===CFG.skills.vines)){ vine.active=true; vine.t=0; if(vine.cur) vine.cur.done=true; burst(active.x,active.y,"#4fbf5a",8); }
    else if(LEVEL===3){ forestX(hx,hy); }
    else if(!treasure.found && Math.abs(hx-treasure.x)<70 && active.onGround){
      treasure.digs++; burst(treasure.x,GROUND,"#d9b56e",14); active.armsT=active.armsMax; active.digT=28;
      if(treasure.digs>=treasure.need){ treasure.found=true; state="win"; setTimeout(startCut,900); }
      else say(`Cavando… (${treasure.digs}/${treasure.need})`,900);
    }
  }
  xHeld=!!keys['x'];
  if(LEVEL===2) updateShip(hx,hy);
  if(LEVEL===3) updateForest(hx,hy);

  // troca manual (C)
  if(keys['c']&&!cHeld&&!vine.active&&!vine.follow){ swapTo('other', "Vai na frente!"); }
  cHeld=!!keys['c'];

  // arremesso (Z)
  if(keys['z']&&!zHeld&&active.throwCd===0&&items.coconuts>0){
    const pow = 13;
    shots.push({x:hx+active.face*20,y:hy-10,vx:active.face*pow,vy:-5,life:90}); items.coconuts--; active.throwCd=18; active.armsT=active.armsMax;
  }
  zHeld=!!keys['z'];
  for(const s of shots){ s.vy+=0.45; s.x+=s.vx; s.y+=s.vy; s.life--; if(s.y>GROUND-10){ s.vy*=-0.5; s.y=GROUND-10; s.vx*=0.7; } }
  shots=shots.filter(s=>s.life>0);

  // caranguejos
  for(const c of crabs){
    if(c.stun>0){ c.stun--; if(c.stun===0){ c.flee=150; c.dir = (active.x+active.w/2>c.x)?-1:1; burst(c.x,GROUND-30,"#fff",8); } continue; }
    if(c.flee>0){ c.flee--; c.x+=c.dir*4.2; if(c.x<c.min){c.x=c.min;c.dir=1;} if(c.x>c.max){c.x=c.max;c.dir=-1;} if(c.flee===0) say("O caranguejo criou coragem e voltou.",1200); continue; } // foge de costas, sem pinçar
    c.x+=c.dir*1.6; if(c.x<c.min||c.x>c.max)c.dir*=-1;
    for(const s of shots){ if(Math.hypot(s.x-c.x,s.y-(GROUND-22))<36){ c.stun=360; s.life=0; burst(c.x,GROUND-22,"#ff6b6b",12); say("Acertou! O caranguejo ficou tonto."); } }
    if(Math.abs(hx-c.x)<40 && active.y+active.h>GROUND-40 && !vine.active){ active.vx=-active.face*9; active.vy=-7; active.x+=active.vx*2; burst(hx,hy,"#ff6b6b",8); say("Ai! Pinça de caranguejo!",1200); }
  }

  // partículas e passarinha
  for(const p of particles){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.3; p.life--; } particles=particles.filter(p=>p.life>0);
  // ajudante no chão, no mesmo plano, à frente (ou atrás) dos heróis
  let btx = active.x + CFG.helperOffset*active.face; if(cage&&!cage.open) btx=cage.x+cage.w+70; const bdx=btx-bird.x;
  bird.vx = Math.abs(bdx)>8 ? Math.sign(bdx)*Math.min(Math.abs(bdx)*0.08, CFG.speed*1.1) : 0; bird.x += bird.vx; bird.face = bird.vx!==0?Math.sign(bird.vx):active.face;
  bird.walking = Math.abs(bird.vx)>0.4;
  let bfloor=null; for(const s of solids){ if(bird.x>s.x && bird.x<s.x+s.w && s.y>=active.y+active.h-120){ if(!bfloor||s.y<bfloor) bfloor=s.y; } }
  if(bridge.built && bird.x>bridge.x && bird.x<bridge.x+bridge.w) bfloor=GROUND;
  const by = bfloor!==null ? bfloor : active.y+active.h; bird.y += (by-bird.y)*0.25;
  bird.wing+=0.3; if(bird.armsT>0)bird.armsT--;

  // câmera
  const target = active.x - W*0.4; cam += (target-cam)*0.1; cam=Math.max(0,Math.min(LEVEL_W-W,cam));

  hudL.textContent = `🧭 ${active.def.name}  (${followers.map(f=>f.def.name).join(', ')} seguindo)`;
  if(LEVEL===3) hudR.textContent = `🌰 ${items.coconuts}   🐛 ${CFG.worm.name}`;
  else if(LEVEL===2) hudR.textContent = `🥥 ${items.coconuts}   ⚔️ ${items.sword?'✓':'?'}` + (boss&&boss.awake&&!boss.done?`   🏴‍☠️ ${'❤️'.repeat(boss.hp)}`:'');
  else hudR.textContent = `🥥 ${items.coconuts}   🪵 ${items.planks}/3`;
}

// ---------- Fase 2: cela, barris, espada, capitão ----------
function updateShip(hx,hy){
  // cela: a ajudante chega com a chave
  if(cage&&!cage.open){
    cage.keyT++;
    if(cage.keyT===90){ cage.helperArrived=true; burst(cage.x+cage.w+70,GROUND-40,"#ffd23f",12); say(`${CFG.helper.name}: "Peguei a chave do carcereiro! Chega perto da porta e aperta X."`,4000); }
    if(cage.helperArrived && cage.keyT%300===0) say(`${CFG.helper.name}: "Aperta X perto da porta da cela!"`,2200);
  }
  if(cage){ cage.doorA += ((cage.open?1:0)-cage.doorA)*0.1; }
  // piratas que jogam barris
  for(const th of throwers){
    if(th.armsT>0)th.armsT--;
    const d=active.x-th.x;
    if(Math.abs(d)<850 && Math.abs(d)>60){ th.timer--; if(th.timer<=0){ th.timer=140; th.armsT=22; th.face=Math.sign(d); barrels.push({x:th.x+th.face*30,y:th.y-26,vx:th.face*3.4,vy:-4,r:22,rot:0,life:520}); } }
  }
  // barris rolando
  for(const b of barrels){
    b.vy+=0.5; if(b.vy>16)b.vy=16; b.x+=b.vx; b.y+=b.vy; b.rot+=b.vx/b.r; b.life--;
    if(b.vy>=0){ const g=groundAt(b.x-b.r,b.r*2,b.y-b.r,b.r*2); if(g){ b.y=g.y-b.r; b.vy=0; } }
    if(b.y>GROUND+80||b.x<-50||b.x>LEVEL_W+50) b.life=0;
    if(b.life>0 && Math.abs(hx-b.x)<b.r+16 && Math.abs(hy-b.y)<b.r+26 && !active.climb) hurt(b.x,"Barril! Pula por cima.");
    for(const s of shots){ if(Math.hypot(s.x-b.x,s.y-b.y)<b.r+12){ b.life=0; s.life=0; popBarrel(b); } }
  }
  // golpe de espada: quebra barris e acerta o capitão
  if(active.swingT>6&&active.swingT<18&&items.sword){
    const rx1=Math.min(hx-45*active.face,hx+active.face*105), rx2=Math.max(hx-45*active.face,hx+active.face*105); // pega um pouco atrás também
    for(const b of barrels){ if(b.life>0&&b.x>rx1-b.r&&b.x<rx2+b.r&&Math.abs(b.y-hy)<70){ b.life=0; popBarrel(b); } }
    if(boss&&!boss.done&&boss.dizzy===0&&!active.swingHit&&boss.x+boss.w>rx1&&boss.x<rx2&&Math.abs(boss.y+boss.h/2-hy)<90){ active.swingHit=true; bossHit(); }
  }
  barrels=barrels.filter(b=>b.life>0);
  // capitão
  if(boss&&!boss.done){
    const bx=boss.x+boss.w/2;
    if(!boss.awake && active.x>4720){ boss.awake=true; say(`Capitão: "Arrr! Ninguém toma o MEU navio!"`,3200); sfx([4,0,-5],0.1,0.8); }
    if(boss.awake){
      if(boss.armsT>0)boss.armsT--;
      if(boss.dizzy>0){ boss.dizzy--; if(boss.dizzy===0){ boss.x = hx<bx ? Math.min(5600,hx+360) : Math.max(4760,hx-360); boss.y=GROUND-boss.h-180; boss.vy=0; burst(boss.x+boss.w/2,boss.y+boss.h,"#fff",14); say(`Capitão: "Volta aqui!"`,1200); } }
      else {
        boss.face = hx<bx?-1:1;
        const d=Math.abs(hx-bx); boss.vx = d>110 ? boss.face*1.5 : 0; boss.x+=boss.vx; if(boss.vx)boss.walk+=0.2;
        boss.timer--; if(boss.timer<=0){ boss.timer=160; boss.armsT=24; barrels.push({x:bx+boss.face*50,y:boss.y+20,vx:boss.face*3.6,vy:-5,r:22,rot:0,life:420}); }
        if(d<60 && Math.abs(hy-(boss.y+boss.h/2))<80) hurt(bx,"Ai! O capitão empurrou!");
        for(const s of shots){ if(s.life>0&&s.x>boss.x-14&&s.x<boss.x+boss.w+14&&s.y>boss.y-14&&s.y<boss.y+boss.h+14){ s.life=0; bossHit(); } }
      }
      boss.vy+=0.6; boss.y+=boss.vy; if(boss.y+boss.h>=GROUND){ boss.y=GROUND-boss.h; boss.vy=0; }
      boss.x=Math.max(4740,Math.min(5620,boss.x));
    }
  }
}
// ---------- Fase 3: pedra, cipós, escuta, família ----------
function heroOf(type){ return heroes.find(h=>h.def.type===type); }
function forestX(hx,hy){
  // pedra pesada
  if(boulder&&!boulder.gone&&active.x+active.w>boulder.x-120&&active.x<boulder.x+boulder.w){
    if(active.def.type!==CFG.skills.strength){ swapTo(CFG.skills.strength,`Pesada demais! Força é com ${heroOf(CFG.skills.strength).def.name}.`); return; }
    boulder.pushes++; boulder.shake=10; active.armsT=active.armsMax; sfx([0,-5],0.08,0.2);
    if(boulder.pushes>=boulder.need){ boulder.gone=true; boulder.roll=0; say(`${active.def.name} empurrou a pedra pro lamaçal — virou passagem!`,3000); sfx([0,4,7,12],0.08,0.5); }
    else { boulder.x+=52; active.x+=52; followers.forEach(f=>f.x+=40); say(`Empurra! (${boulder.pushes}/${boulder.need})`,900); }
    return;
  }
  // escutar a floresta
  const li=listens.find(l=>!l.done&&Math.abs(hx-l.x)<170);
  if(li){
    if(active.def.type!==CFG.skills.hearing){ swapTo(CFG.skills.hearing,`Shh… quem escuta melhor é ${heroOf(CFG.skills.hearing).def.name}!`); return; }
    li.done=true; li.t=90; active.armsT=active.armsMax; sfx([7,12,16,19],0.05,0.6);
    if(li.kind==='wall') say(`${CFG.helper.name}: "Ouviu o riacho? O caminho é por ali — as folhas abriram!"`,3400);
    else { wormFamily.visible=true; say(`${CFG.helper.name}: "Ouviu? A família do ${CFG.worm.name} está chamando ali na clareira!"`,3600); }
  }
}
function updateForest(hx,hy){
  // dicas de proximidade
  if(msgTimer<=0){
    if(boulder&&!boulder.gone&&active.x+active.w>boulder.x-120&&active.x<boulder.x) say(`${CFG.helper.name}: "Uma pedra enorme! Aperta X pra empurrar."`,1800);
    const li=listens.find(l=>!l.done&&Math.abs(hx-l.x)<170); if(li) say(`${CFG.helper.name}: "Tá ouvindo alguma coisa? Aperta X pra escutar."`,1800);
  }
  if(boulder){ if(boulder.shake>0)boulder.shake--; if(boulder.gone&&boulder.roll<1){ boulder.roll+=0.03; if(boulder.roll>=1){ boulder.roll=1; water=water.filter(w=>w.x!==boulder.pit.x); solids.push({x:boulder.pit.x-10,y:GROUND,w:boulder.pit.w+20,h:200}); burst(boulder.pit.x+80,GROUND,"#6b4a2a",24); } } }
  for(const li of listens){ if(li.t>0){ li.t--; if(li.kind==='wall'&&li.t===45){ li.wall=null; burst(4300,GROUND-90,"#7ed37e",30); } } }
  for(const m of mushrooms) if(m.sq>0)m.sq--;
  if(wormFamily.visible) wormFamily.t++;
  // a minhoca vai no ombro de quem lidera
  if(worm&&!worm.free){ worm.wig+=0.15; worm.x=active.x+active.w/2-active.face*6; worm.y=active.y-CFG.worm.offsetY; }
  if(worm&&worm.free){ worm.hop+=0.2; }
  // final: chegou na família
  if(wormFamily.visible&&!worm.free&&active.x+active.w>wormFamily.x-120){
    worm.free=true; worm.x=wormFamily.x-70; worm.y=GROUND; burst(worm.x,GROUND-20,"#ffd23f",30); sfx([0,4,7,12,16],0.1,0.8);
    say(`${CFG.worm.name} encontrou a família! Que festa!`,3500); state="win"; setTimeout(showWin3,3200);
  }
}
function popBarrel(b){ burst(b.x,b.y,"#a9733a",14); burst(b.x,b.y,"#5e3a18",6); sfx([12,7],0.05,0.15); }
function bossHit(){

const ROW={idle:0,walk:1,jump:2,arms:3};
// desenha um quadro da folha; escolhe linha esquerda/direita se existir, senão espelha
function drawSheetFrame(sh,cfg,anim,fi,face,cx,by,hh,center,foot=0){
  const fw=sh.width/cfg.cols, fh=sh.height/cfg.rows, ww=hh*fw/fh, fo=foot*hh/fh;
  const hasLeft=cfg.rows>=8; if(anim==='arms'&&!cfg.frames.arms) anim='jump'; let row=ROW[anim]; if(hasLeft&&face<0) row+=4;
  ctx.save(); ctx.translate(cx,by); if(!hasLeft) ctx.scale(face,1);
  ctx.drawImage(sh, fi*fw, row*fh, fw, fh, -ww/2, (center?-hh/2:-hh)+fo, ww, hh);
  ctx.restore(); return ww;
}
// pá na mão enquanto cava (cx,by = centro dos pés; hh = altura do personagem na tela)
function drawShovel(h,cx,by,hh){
  if(h.digT<=0) return;

  const L=hh*0.55;
  ctx.strokeStyle="#8a5a2b"; ctx.lineWidth=Math.max(4,hh*0.035); ctx.lineCap="round"; ctx.beginPath(); ctx.moveTo(0,-L*0.45); ctx.lineTo(0,L*0.45); ctx.stroke();

  ctx.fillStyle="#9aa4ad"; ctx.beginPath(); ctx.moveTo(-L*0.16,L*0.42); ctx.lineTo(L*0.16,L*0.42); ctx.lineTo(L*0.13,L*0.72); ctx.quadraticCurveTo(0,L*0.82,-L*0.13,L*0.72); ctx.closePath(); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.35)"; ctx.beginPath(); ctx.moveTo(-L*0.1,L*0.46); ctx.lineTo(-L*0.03,L*0.46); ctx.lineTo(-L*0.04,L*0.7); ctx.lineTo(-L*0.1,L*0.66); ctx.fill();

  ctx.restore();
}
// espada pirata na mão durante o golpe
function drawSword(h,cx,by,hh){
  if(h.swingT<=0) return;
  const p=1-h.swingT/22, ang=-1.5+Math.sin(p*Math.PI/2)*2.4;
  ctx.save(); ctx.translate(cx+h.face*hh*0.25, by-hh*0.45); ctx.scale(h.face,1); ctx.rotate(ang);
  const L=hh*0.6;

  ctx.fillStyle="#ffd23f"; rr(-L*0.14,-L*0.06,L*0.28,L*0.06,3); ctx.fill();            // guarda
  ctx.fillStyle="#cfd8dc"; ctx.beginPath(); ctx.moveTo(-L*0.05,-L*0.06); ctx.lineTo(L*0.05,-L*0.06); ctx.quadraticCurveTo(L*0.2,-L*0.6,L*0.02,-L*1.0); ctx.quadraticCurveTo(-L*0.02,-L*0.6,-L*0.05,-L*0.06); ctx.fill(); // lâmina curva

function drawHero(h,isActive){

function makePatterns(){

  PAT.sandDeep=mk(160,160,(x,w,h)=>{ const r=rnd(11); for(let i=0;i<220;i++){ x.fillStyle=['#c99b57','#e0bb7c','#b88647'][i%3]; x.globalAlpha=0.3+r()*0.4; x.beginPath(); x.arc(r()*w,r()*h,0.6+r()*1.8,0,Math.PI*2); x.fill(); } });

  PAT.grass=mk(60,16,(x,w,h)=>{ x.fillStyle='#4fbf5a'; x.fillRect(0,0,w,h); const r=rnd(5); x.strokeStyle='#2e8a3a'; x.lineWidth=2; for(let i=0;i<14;i++){ const px=r()*w; x.beginPath(); x.moveTo(px,h); x.lineTo(px+(r()-.5)*5,h-5-r()*8); x.stroke(); } });

  ctx.fillStyle="#5e3a18"; ctx.fillRect(-100,GROUND,LEVEL_W+200,H-GROUND); ctx.fillStyle=PAT.wood; ctx.globalAlpha=0.6; ctx.fillRect(-100,GROUND,LEVEL_W+200,H-GROUND); ctx.globalAlpha=1;
  // amurada (grade do fundo do convés)
  ctx.fillStyle="#7a4a24"; for(let x=0;x<LEVEL_W;x+=120){ rr(x,GROUND-80,14,80,3); ctx.fill(); } ctx.fillStyle="#8a5a2b"; ctx.fillRect(0,GROUND-86,LEVEL_W,14); ctx.fillStyle="rgba(255,255,255,.2)"; ctx.fillRect(0,GROUND-86,LEVEL_W,3);
  // parede do porão atrás da cela (com escotilha redonda) e cabine de popa
  ctx.fillStyle="#4a2f18"; ctx.fillRect(-100,120,700,GROUND-120); ctx.fillStyle=PAT.wood; ctx.globalAlpha=0.5; ctx.fillRect(-100,120,700,GROUND-120); ctx.globalAlpha=1;
  ctx.fillStyle="#2a1a0c"; ctx.fillRect(590,120,12,GROUND-120);
  ctx.fillStyle="#6b4a2a"; ctx.beginPath(); ctx.arc(300,300,60,0,Math.PI*2); ctx.fill(); ctx.fillStyle="#7fc2ea"; ctx.beginPath(); ctx.arc(300,300,46,0,Math.PI*2); ctx.fill(); ctx.fillStyle="rgba(255,255,255,.5)"; ctx.beginPath(); ctx.ellipse(285,285,14,8,0.7,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#ffd23f"; ctx.beginPath(); ctx.arc(520,250,10,0,Math.PI*2); ctx.fill(); ctx.strokeStyle="#333"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(520,240); ctx.lineTo(520,200); ctx.stroke(); // lanterna
  ctx.fillStyle="#6b4a2a"; ctx.fillRect(4650,300,LEVEL_W-4650+200,GROUND-300); ctx.fillStyle=PAT.wood; ctx.globalAlpha=0.5; ctx.fillRect(4650,300,LEVEL_W-4650+200,GROUND-300); ctx.globalAlpha=1;
  for(let i=0;i<4;i++){ ctx.fillStyle="#3a2412"; rr(4760+i*260,360,90,90,10); ctx.fill(); ctx.fillStyle="#9ad0f0"; rr(4770+i*260,370,70,70,8); ctx.fill(); ctx.fillStyle="#3a2412"; ctx.fillRect(4803+i*260,370,4,70); ctx.fillRect(4770+i*260,403,70,4); }
  ctx.fillStyle="#3a2412"; rr(5100,420,80,180,10); ctx.fill(); ctx.fillStyle="#ffd23f"; ctx.beginPath(); ctx.arc(5165,515,6,0,Math.PI*2); ctx.fill(); // porta da cabine
  // mastros, velas, gáveas, cordas
  for(const r of ropes){
    ctx.fillStyle="#f5ead6"; ctx.beginPath(); ctx.moveTo(r.x-230,110); ctx.quadraticCurveTo(r.x,170+Math.sin(t/900)*8,r.x+230,110); ctx.lineTo(r.x+230,330); ctx.quadraticCurveTo(r.x,400+Math.sin(t/900)*8,r.x-230,330); ctx.closePath(); ctx.fill();
    ctx.fillStyle="rgba(0,0,0,.08)"; ctx.fillRect(r.x-230,110,460,8); ctx.fillRect(r.x-230,250,460,6);
    ctx.fillStyle="#6b3e1c"; ctx.fillRect(r.x-240,104,480,12); ctx.fillRect(r.x-180,330,360,10);
    ctx.fillStyle="#7a4a24"; ctx.fillRect(r.x-13,40,26,GROUND-40); ctx.fillStyle="rgba(255,255,255,.15)"; ctx.fillRect(r.x-13,40,8,GROUND-40);
    ctx.strokeStyle="rgba(60,40,20,.7)"; ctx.lineWidth=2; for(const dx of [-360,-300,300,360]){ ctx.beginPath(); ctx.moveTo(r.x,60); ctx.lineTo(r.x+dx,GROUND-80); ctx.stroke(); }
    // corda de escalada
    ctx.strokeStyle="#c9a46a"; ctx.lineWidth=7; ctx.lineCap="round"; ctx.beginPath(); ctx.moveTo(r.x,r.top-10); ctx.lineTo(r.x,r.bottom); ctx.stroke();
    ctx.fillStyle="#8a6a3a"; for(let y=r.top+20;y<r.bottom;y+=30){ ctx.beginPath(); ctx.ellipse(r.x,y,8,4,0,0,Math.PI*2); ctx.fill(); }
  }
  drawFlag(ropes[0].x+13,40);
  // escotilhas abertas (buracos no convés)
  for(const h of hatches){ ctx.fillStyle="#1a0f06"; ctx.fillRect(h.x,GROUND,h.w,200); ctx.fillStyle="#3a2412"; rr(h.x-10,GROUND-8,h.w+20,14,4); ctx.fill(); ctx.strokeStyle="#6b3e1c"; ctx.lineWidth=4; for(let y=GROUND+20;y<GROUND+200;y+=28){ ctx.beginPath(); ctx.moveTo(h.x+20,y); ctx.lineTo(h.x+60,y); ctx.stroke(); } ctx.beginPath(); ctx.moveTo(h.x+22,GROUND+10); ctx.lineTo(h.x+22,GROUND+200); ctx.moveTo(h.x+58,GROUND+10); ctx.lineTo(h.x+58,GROUND+200); ctx.stroke(); }
  // convés e plataformas
  for(const s of solids){
    if(s.h>100){ ctx.fillStyle="#b07a40"; ctx.fillRect(s.x,s.y,s.w,50); ctx.fillStyle=PAT.wood; ctx.fillRect(s.x,s.y,s.w,50); ctx.fillStyle="rgba(0,0,0,.25)"; for(let y=s.y+12;y<s.y+50;y+=12) ctx.fillRect(s.x,y,s.w,2); ctx.fillStyle="rgba(255,255,255,.3)"; ctx.fillRect(s.x,s.y,s.w,4); ctx.fillStyle="rgba(0,0,0,.15)"; ctx.fillRect(s.x,s.y+50,s.w,6); }
    else { ctx.fillStyle="rgba(0,0,0,.2)"; rr(s.x+4,s.y+6,s.w,s.h,6); ctx.fill(); ctx.fillStyle=PAT.wood; rr(s.x,s.y,s.w,s.h,6); ctx.fill(); ctx.strokeStyle="#5e3a18"; ctx.lineWidth=2; rr(s.x,s.y,s.w,s.h,6); ctx.stroke(); ctx.fillStyle="rgba(255,255,255,.25)"; rr(s.x+2,s.y+2,s.w-4,4,2); ctx.fill(); }
  }
  // cela
  if(cage){
    const top=GROUND-190;
    ctx.fillStyle="#2b2b2b"; rr(cage.x-10,top-14,cage.w+20,16,4); ctx.fill();
    ctx.fillStyle="#555"; for(let x=cage.x;x<cage.x+cage.w-110;x+=36){ rr(x,top,10,190,3); ctx.fill(); }
    ctx.save(); ctx.translate(cage.x+cage.w-110,top); ctx.rotate(-cage.doorA*1.4); ctx.fillStyle="#555"; for(let x=0;x<=100;x+=36){ rr(x,0,10,190,3); ctx.fill(); } ctx.fillStyle="#333"; rr(0,0,110,10,3); ctx.fill(); rr(0,90,110,10,3); ctx.fill(); rr(0,180,110,10,3); ctx.fill(); ctx.strokeStyle="#2b2b2b"; ctx.lineWidth=5; rr(-2,-2,114,194,4); ctx.stroke(); // porta com moldura
    if(!cage.open){ ctx.fillStyle="#ffd23f"; rr(90,92,20,20,4); ctx.fill(); ctx.strokeStyle="#ffd23f"; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(100,92,8,Math.PI,0); ctx.stroke(); }
    ctx.restore();
  }
  // baú da espada
  if(swordChest){ const cx=swordChest.x, cy=swordChest.y; ctx.fillStyle="#8a5a2b"; rr(cx-30,cy-44,60,44,6); ctx.fill(); ctx.fillStyle="#ffd23f"; rr(cx-34,cy-50,68,12,4); ctx.fill(); if(!swordChest.got){ ctx.fillStyle="#cfd8dc"; ctx.save(); ctx.translate(cx,cy-40); ctx.rotate(-0.6+Math.sin(t/400)*0.1); rr(-4,-60,8,60,3); ctx.fill(); ctx.fillStyle="#ffd23f"; rr(-14,-4,28,6,2); ctx.fill(); ctx.restore(); } }
  // cocos, cocos voando, barris
  for(const c of coconuts) if(!c.got){ ctx.fillStyle="#6b3e1c"; ctx.beginPath(); ctx.arc(c.x,c.y+Math.sin(Date.now()/350+c.x)*3,14,0,Math.PI*2); ctx.fill(); ctx.fillStyle="#3a2210"; ctx.beginPath(); ctx.arc(c.x-4,c.y-4,2,0,Math.PI*2); ctx.arc(c.x+4,c.y-4,2,0,Math.PI*2); ctx.fill(); }
  for(const s of shots){ ctx.fillStyle="#6b3e1c"; ctx.beginPath(); ctx.arc(s.x,s.y,11,0,Math.PI*2); ctx.fill(); }
  for(const b of barrels) drawBarrel(b.x,b.y,b.r,b.rot);
  drawCrabs();
  // capangas
  for(const th of throwers) drawPirate(th.x,th.y,th.face,0.85,th.armsT,0,false,false);
  // capitão
  if(boss){
    const bx=boss.x+boss.w/2;
    if(boss.dizzy>0){ ctx.save(); ctx.translate(bx,boss.y-20); ctx.fillStyle="#ffd23f"; for(let i=0;i<3;i++){ const a=t/300+i*2.1; ctx.beginPath(); ctx.arc(Math.cos(a)*34,Math.sin(a)*10,5,0,Math.PI*2); ctx.fill(); } ctx.restore(); }
    drawPirate(bx,boss.y+boss.h,boss.face,1.5,boss.armsT,boss.walk,true,boss.dizzy>0||boss.done);
    if(boss.awake&&!boss.done){ for(let i=0;i<boss.max;i++){ ctx.fillStyle=i<boss.hp?"#ff4d6d":"rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(bx-24+i*24,boss.y-135,9,0,Math.PI*2); ctx.fill(); } }
    if(boss.done){ ctx.fillStyle="#fff"; ctx.fillRect(bx+20,boss.y-30,4,40); ctx.fillRect(bx+24,boss.y-30,30,18); } // bandeira branca
  }
  // timão
  if(wheel){ ctx.save(); ctx.translate(wheel.x,GROUND-90); ctx.rotate(t/3000); ctx.strokeStyle="#6b3e1c"; ctx.lineWidth=10; ctx.beginPath(); ctx.arc(0,0,40,0,Math.PI*2); ctx.stroke(); for(let i=0;i<8;i++){ ctx.beginPath(); ctx.moveTo(0,0); const a=i*Math.PI/4; ctx.lineTo(Math.cos(a)*56,Math.sin(a)*56); ctx.stroke(); } ctx.fillStyle="#ffd23f"; ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill(); ctx.restore(); ctx.fillStyle="#6b3e1c"; ctx.fillRect(wheel.x-8,GROUND-60,16,60); }
  // partículas
  for(const p of particles){ ctx.fillStyle=p.c; ctx.globalAlpha=Math.max(0,p.life/40); ctx.fillRect(p.x-3,p.y-3,6,6); } ctx.globalAlpha=1;
  ctx.restore();

  if(heroes){ [...followers].reverse().forEach(f=>drawHero(f,false)); drawHero(active,true); drawBird(); }
  // primeiro plano: cordas enroladas e a amurada da frente passando rápido
  for(let i=0;i<8;i++){ const fx=((i*900+300 - cam*1.2)%(W+800)+W+800)%(W+800)-400; ctx.strokeStyle="#c9a46a"; ctx.lineWidth=8; for(let k=0;k<3;k++){ ctx.beginPath(); ctx.ellipse(fx,H-24-k*7,40-k*4,12,0,0,Math.PI*2); ctx.stroke(); } }
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.55,W/2,H/2,H*1.05); vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(20,20,40,.35)"); ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
}

function loop(){ try{ update(); draw(); }catch(e){ window.onerror(e.message,'',0); } requestAnimationFrame(loop); }
buildLevel(); loop();
</script>
</body>
